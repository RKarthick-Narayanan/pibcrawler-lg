name: PIB live one-day probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-pilot.yml'

jobs:
  single-day-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Attempt an explicitly bounded keyword query
        shell: bash
        run: |
          set +e
          python pibcrawler.py run \
            --term tribal_language \
            --start 2024-08-08 \
            --end 2024-08-08 \
            --window-days 1 \
            --max-pages 2 \
            --delay 2 \
            --output data/live-probe > probe.log 2>&1
          status=$?
          cat probe.log
          echo "PIB pilot exit status: $status"
          exit "$status"
      - name: Preserve source evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pib-tribal-language-one-day-probe
          path: |
            probe.log
            data/live-probe/
          if-no-files-found: warn
          retention-days: 7
